name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # lib/safenet, for the sentinel tests

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Install dependencies
        # pnpm clones git dependencies that use `&path:` (Zodiac Roles) over SSH, and the runner has
        # no SSH key; fetch them over HTTPS instead.
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          pnpm install --frozen-lockfile

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: pnpm test

      - name: Sentinel fork tests (Gnosis mainnet)
        # Runs only when the repository has a GNOSIS_RPC_URL secret (forks and PRs from forks don't).
        env:
          GNOSIS_RPC_URL: ${{ secrets.GNOSIS_RPC_URL }}
        run: |
          if [ -n "$GNOSIS_RPC_URL" ]; then pnpm test:fork:sentinel
          else echo "GNOSIS_RPC_URL secret not set; skipping the fork suite"; fi

      - name: Check licenses of src/
        run: ./script/check-licenses.sh

      - name: Run the attack demo
        run: ./script/demo.sh

      - name: Deploy a restricted Safe from a config file (local chain, end to end)
        run: ./script/factory/local-e2e.sh
